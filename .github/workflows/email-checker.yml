name: Email Checker (Scheduled Polling)

on:
  schedule:
    # Run every 1 minute for testing
    # Cron format: minute hour day month day-of-week
    - cron: '*/1 * * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.EMAIL_PASSWORD }}" ]; then
            echo "Error: EMAIL_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "Error: GROQ_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SENDGRID_API_KEY }}" ]; then
            echo "Error: SENDGRID_API_KEY secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are set"
      
      - name: Create data directories
        run: |
          mkdir -p data/phase5
          mkdir -p data/raw
          mkdir -p data/classified
          mkdir -p data/reports/html
          mkdir -p data/reports/json
          mkdir -p data/reports/graphs
          # Initialize processed_emails.json if it doesn't exist
          if [ ! -f data/phase5/processed_emails.json ]; then
            echo '{"processed_uids": [], "last_updated": "", "total_count": 0}' > data/phase5/processed_emails.json
          fi
          echo "✓ All data directories created"
      
      - name: Check email inbox
        id: check_email
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          PYTHONUNBUFFERED: 1  # Ensure Python output is not buffered
        run: |
          echo "=========================================="
          echo "📧 Email Checker Workflow"
          echo "=========================================="
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Email: harikrish656@gmail.com"
          echo "Subject filter: [ANALYZE]"
          echo "IMAP server: imap.gmail.com:993"
          echo "IMAP folder: INBOX"
          echo ""
          echo "⚠️  IMPORTANT: Email must have:"
          echo "   1. Subject containing '[ANALYZE]' (exact match)"
          echo "   2. Status: UNSEEN (unread)"
          echo "   3. Sender must be in authorized list: harikrish656@gmail.com"
          echo ""
          echo "Starting email check..."
          echo ""
          
          # Run email check and capture exit code
          set +e  # Don't exit on error
          python -m src.cli check-email 2>&1 | tee email_check.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e  # Re-enable exit on error
          
          echo ""
          echo "=========================================="
          echo "Email check completed with exit code: $EXIT_CODE"
          echo "=========================================="
          echo ""
          echo "📋 Full email check log:"
          cat email_check.log || true
          
          # Set output for next step
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Exit with 0 even if no emails found (this is normal)
          # Only fail on actual errors (connection issues, etc.)
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Email check completed successfully"
          elif grep -q "No new emails to process" email_check.log; then
            echo "ℹ️  No new emails found (this is normal)"
            exit 0
          else
            echo "❌ Email check failed with errors"
            exit $EXIT_CODE
          fi
      
      - name: Report status
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 Email Check Summary"
          echo "=========================================="
          echo "Workflow Status: ${{ job.status }}"
          echo "Exit Code: ${{ steps.check_email.outputs.exit_code }}"
          echo ""
          if [ -f email_check.log ]; then
            echo "Last 100 lines of email check log:"
            echo "----------------------------------------"
            tail -100 email_check.log || true
            echo "----------------------------------------"
          else
            echo "⚠️  No log file found"
          fi
          echo ""
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Workflow completed successfully"
            if grep -q "Processed.*email" email_check.log; then
              echo "📧 Emails were processed"
            else
              echo "ℹ️  No new emails to process (this is normal)"
            fi
          else
            echo "❌ Workflow encountered an error"
            echo ""
            echo "Common issues:"
            echo "1. Check if EMAIL_PASSWORD secret is set correctly (Gmail App Password)"
            echo "2. Verify email subject contains '[ANALYZE]' exactly"
            echo "3. Ensure email is unread (UNSEEN)"
            echo "4. Check IMAP access is enabled in Gmail settings"
            echo "5. Verify sender email is in authorized_senders list"
            echo "6. Check workflow logs for specific error messages"
          fi
          echo "=========================================="

