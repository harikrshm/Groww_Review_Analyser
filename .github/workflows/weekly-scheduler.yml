name: Weekly Email Scheduler

on:
  schedule:
    # Run every Monday at 9:00 AM IST (3:30 AM UTC)
    # Cron format: minute hour day month day-of-week
    # IST is UTC+5:30, so 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.SENDGRID_API_KEY }}" ]; then
            echo "Error: SENDGRID_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "Error: GROQ_API_KEY secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are set"
      
      - name: Send weekly report
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m src.cli send-latest --force
      
      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Weekly report sent successfully"
          else
            echo "❌ Weekly report failed"
            exit 1
          fi

