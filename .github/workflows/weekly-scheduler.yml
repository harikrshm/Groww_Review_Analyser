name: Weekly Email Scheduler

on:
  schedule:
    # Run every Monday at 9:00 AM IST (3:30 AM UTC)
    # Cron format: minute hour day month day-of-week
    # IST is UTC+5:30, so 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increased timeout for full pipeline execution
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create data directories
        run: |
          mkdir -p data/raw
          mkdir -p data/classified
          mkdir -p data/reports/html
          mkdir -p data/reports/json
          mkdir -p data/reports/graphs
          echo "✓ Data directories created"
      
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.SENDGRID_API_KEY }}" ]; then
            echo "Error: SENDGRID_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "Error: GROQ_API_KEY secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are set"
      
      - name: Calculate date range for last week
        id: dates
        run: |
          # Calculate last week's date range (7 days ago to today) using Python
          python3 << 'EOF'
          from datetime import datetime, timedelta
          import os
          
          end_date = datetime.utcnow()
          start_date = end_date - timedelta(days=7)
          
          start_str = start_date.strftime('%Y-%m-%d')
          end_str = end_date.strftime('%Y-%m-%d')
          
          # Write to GitHub output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"START_DATE={start_str}\n")
              f.write(f"END_DATE={end_str}\n")
          
          print(f"📅 Date range: {start_str} to {end_str}")
          EOF
      
      - name: Generate and send weekly report
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: 1  # Ensure Python output is not buffered
        run: |
          echo "🚀 Running full pipeline: scrape → classify → summarize → email"
          echo "📅 Date range: ${{ steps.dates.outputs.START_DATE }} to ${{ steps.dates.outputs.END_DATE }}"
          echo ""
          python -m src.main run \
            --start-date ${{ steps.dates.outputs.START_DATE }} \
            --end-date ${{ steps.dates.outputs.END_DATE }} \
            --send-email 2>&1 | tee pipeline.log
          echo ""
          echo "📋 Pipeline execution log:"
          tail -100 pipeline.log || true
      
      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Weekly report sent successfully"
          else
            echo "❌ Weekly report failed"
            exit 1
          fi

